[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "screen-to-agent"
dynamic = ["version"]
description = "截屏提问并转发给本地 Codex CLI 或其他 Agent 的 Windows 工具"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "httpx>=0.27",
    "zstandard>=0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyinstaller>=6.11",
]

[project.scripts]
screen-to-agent = "screen_to_agent.app:main"

[tool.hatch.version]
path = "screen_to_agent/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["screen_to_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100
